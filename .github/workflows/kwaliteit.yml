name: Controle visualisaties
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  berekeningen-en-integratie:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tests/run.cjs
      - run: python3 tests/structure.py
  browsercontrole:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Controleer desktop, mobiel en iframes
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/scientias-8000.log 2>&1 &
          server_a=$!
          python3 -m http.server 8001 --bind 127.0.0.1 > /tmp/scientias-8001.log 2>&1 &
          server_b=$!
          trap 'kill "$server_a" "$server_b"' EXIT
          sleep 1
          node tests/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browsercontrole
          path: test-results/
          if-no-files-found: ignore
