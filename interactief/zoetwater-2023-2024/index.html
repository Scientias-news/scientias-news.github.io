<h1 class="sc-title">Zuid-Amerika droogde uit, de Lage Landen kregen er water bij</h1>
<p class="sc-sub">Hoeveel water er in 2023 en 2024 door de rivieren van 985 rivierbekkens stroomde, vergeleken met een gemiddeld jaar tussen 1991 en 2020. Een rivierbekken is het hele gebied waarvan het regenwater naar dezelfde rivier stroomt.</p>
<div class="kpis"><div class="kpi"><b>5,7% minder</b><span>rivierwater wereldwijd in 2023 en 2024, de grootste daling sinds 1991</span></div><div class="kpi"><b>70% van het verlies</b><span>komt uit Zuid-Amerika, waar de rivieren 17,8% leger waren</span></div><div class="kpi"><b>37% meer</b><span>water in het bekken van Maas en Schelde, en 23% meer in dat van de Rijn</span></div></div>

<div class="timeline"><p class="mapcap" id="tijdlijn-titel">Wereldwijd: rivierwater per jaar tegenover normaal</p><div id="tijdlijn" role="img" aria-labelledby="tijdlijn-titel" aria-describedby="tijdlijn-uitleg"></div><p class="sr-only" id="tijdlijn-uitleg">Een staafdiagram van 1991 tot 2025. De afwijking schommelt meestal tussen 6% meer en 5% minder. In 2023 was het 6,6% minder, in 2024 4,8% minder, en in 2025 weer 1,0% meer dan normaal.</p></div>

<div class="sc-notes"><p>Normaal is het gemiddelde van 1991 tot en met 2020. Gebieden met gemiddeld minder dan 10 millimeter rivierwater per jaar, zoals woestijnen, zijn lichtgrijs gearceerd: daar geven kleine verschillen grote percentages. De oorzaak is berekend voor 193 grotere bekkens en geldt voor de periode 2023 en 2024 samen. Groenland en Antarctica vallen buiten het onderzoek.</p><p>Voor de meeste bekkens zijn er geen rechtstreekse metingen. De onderzoekers schatten de afvoer met vijf zelflerende computermodellen, getraind op metingen in 150 grote bekkens.</p></div>
