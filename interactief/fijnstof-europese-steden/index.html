<div class="sc-body"><h1 class="sc-title">Geen enkele stad in Nederland of België haalt de fijnstofnorm van de WHO</h1>
<p class="sc-sub">Gemiddelde hoeveelheid fijnstof (PM2,5) in de lucht van 761 Europese steden. De Wereldgezondheidsorganisatie raadt hooguit 5 microgram per kubieke meter aan; slechts 21 steden blijven daaronder.</p>
<div class="kpis"><div class="kpi"><b>21 van de 761</b><span>Europese steden halen het WHO-advies voor fijnstof</span></div><div class="kpi"><b>0 van de 62</b><span>Nederlandse en Belgische steden halen het</span></div><div class="kpi"><b>5,6 keer zoveel</b><span>fijnstof in Slavonski Brod (Kroatië) als het WHO-advies</span></div></div>
<div class="sc-legend"><span class="legend-title">Microgram fijnstof per m³:</span><span><i class="dot pm-safe"></i>Haalt WHO-advies (≤ 5)</span><span><i class="dot pm-low"></i>Meer dan 5 tot en met 10</span><span><i class="dot pm-medium"></i>Meer dan 10 tot en met 15</span><span><i class="dot pm-high"></i>Meer dan 15 tot en met 20</span><span><i class="dot pm-very-high"></i>Meer dan 20</span></div>

<div class="sc-notes"><p>Elke stip is een stad; hoe groter de stip, hoe meer inwoners. De ranglijst (#) kijkt naar het totale gezondheidsrisico van fijnstof, stikstofdioxide en ozon samen: #1 is de gezondste stad van de 761, #761 de minst gezonde. Antwerpen is met plaats 492 de laagst gerangschikte stad van Nederland en België.</p><p>Fijnstof zijn deeltjes kleiner dan 2,5 duizendste millimeter, die diep in de longen en de bloedbaan doordringen. Belangrijke bronnen zijn verkeer, industrie, landbouw en het stoken van hout.</p></div>
